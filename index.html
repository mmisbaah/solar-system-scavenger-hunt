<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Solar System Scavenger Hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one screen, no page scroll. Mission card beside the map on wide screens, under the map on tall ones; the card scrolls inside itself. Passport and players open as dialogs. Single deliberate deep-space look. */
:root {
  color-scheme: dark;
  --space: #0a0f2c;
  --space-2: #151c46;
  --line: #2d3675;
  --orbit: #343f80;
  --paper: #fff4d8;
  --paper-2: #fffaf0;
  --paper-edge: #c9b98f;
  --ink: #221c40;
  --ink-soft: #6b5d33;
  --sun: #ffc23d;
  --sun-deep: #b36b00;
  --good: #52dba6;
  --good-ink: #13805a;
  --oops: #ff7f6e;
  --oops-ink: #c4412f;
  --violet: #6b46c1;
  --dim: #a9b0e0;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; }
body { height: 100%; margin: 0; overflow: hidden; background: var(--space); color: var(--paper); font-family: var(--body); font-size: 17px; line-height: 1.4; }
#stars, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#stars { z-index: 0; }
#fx { z-index: 50; }
.app {
  position: relative; z-index: 1; height: 100%; max-width: 1320px; margin: 0 auto;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px;
}
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
h1 { font-family: var(--display); font-weight: 400; margin: 0; font-size: clamp(17px, 2.6vw, 30px); line-height: 1.05; color: var(--sun); text-shadow: 0 2px 0 var(--sun-deep), 0 0 20px rgba(255, 194, 61, .3); }
.controls { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 700 14px/1 var(--body); color: var(--paper); background: var(--space-2); border: 2px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--sun); color: var(--sun); }
.chip.warn { border-color: var(--sun); background: var(--sun); color: var(--ink); }
.chip:hover { border-color: var(--dim); }
.chip b { color: var(--sun); font-variant-numeric: tabular-nums; }
.sm { display: none; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

.game { display: grid; grid-template-columns: minmax(0, 370px) minmax(0, 1fr); gap: 14px; min-height: 0; }

/* Mission card */
.card { background: var(--paper); color: var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--paper-edge), 0 14px 32px rgba(0,0,0,.4); display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative; }
.card.found { background: #e9fff5; box-shadow: 0 5px 0 #8fd6b8, 0 14px 32px rgba(0,0,0,.4); }
.card-body { overflow-y: auto; padding: 16px 18px 10px; display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; min-height: 0; overscroll-behavior: contain; }
.card-body > * { flex: none; }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 18px 14px; border-top: 2px dashed rgba(107, 93, 51, .2); }
.card-actions:empty { display: none; }
.step { font: 400 11px/1.2 var(--display); letter-spacing: .08em; color: var(--ink-soft); }
.clue { font-size: clamp(19px, 2.1vw, 23px); font-weight: 700; line-height: 1.3; margin: 0; text-wrap: pretty; }
.ask { font-weight: 800; color: var(--violet); }
.hero { display: flex; align-items: center; gap: 12px; }
.sayit { margin: 4px 0 0; font-size: 14px; color: var(--ink-soft); font-weight: 600; }
.sayit b { color: var(--violet); letter-spacing: .02em; }
.mini-row { margin: -4px 0 0; }
.lbl { display: block; font: 400 10px/1.2 var(--display); letter-spacing: .06em; color: var(--ink-soft); margin-bottom: 4px; }
.you { background: rgba(107, 70, 193, .08); border: 2px solid rgba(107, 70, 193, .25); border-radius: 12px; padding: 10px 12px; }
.you ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; font-weight: 600; font-size: 15px; }
.you b { color: var(--violet); }
.people { margin: 0; font-size: 15px; font-weight: 600; background: rgba(255, 194, 61, .14); border-radius: 12px; padding: 10px 12px; }
.explain { margin: 0; font-weight: 700; font-size: 17px; background: rgba(82, 219, 166, .16); border-radius: 12px; padding: 10px 12px; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opt { font: 800 17px/1.2 var(--body); color: var(--ink); background: var(--paper-2); border: 2px solid var(--paper-edge); border-radius: 12px; padding: 12px 10px; cursor: pointer; min-height: 48px; }
.opt:hover { border-color: var(--violet); }
.opt.pic { display: grid; justify-items: center; gap: 4px; font-size: 15px; }
.opt.pic img { width: 52px; height: 52px; }
.opt.pic .noimg { font-size: 34px; line-height: 52px; height: 52px; }
.lesson { display: grid; gap: 10px; }
.lesson-pics { display: flex; gap: 14px; flex-wrap: wrap; }
.lesson-pics figure { margin: 0; display: grid; justify-items: center; gap: 2px; font-weight: 700; font-size: 13px; color: var(--ink-soft); }
.lesson-pics img { width: 64px; height: 64px; }
.clue.small { font-size: clamp(17px, 1.9vw, 20px); }
.rules { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; font-weight: 700; }
.sky { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.sky li { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.sky li.dim { opacity: .55; }
.sky img { width: 40px; height: 40px; flex: none; }
.side-links { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.side-links .mini { font-size: 15px; }
.aboutme .addrow { align-items: end; }
.field { display: grid; gap: 2px; font-weight: 700; font-size: 13px; color: var(--ink-soft); }
.field input, .field select { font: 700 16px/1 var(--body); padding: 9px 10px; border-radius: 10px; border: 2px solid var(--paper-edge); background: #fff; color: var(--ink); width: 90px; }
.hero img { width: 76px; height: 76px; flex: none; filter: drop-shadow(0 4px 10px rgba(34, 28, 64, .35)); }
.hero img.wide { width: 110px; height: 110px; margin: -17px -8px; }
.title { margin: 0; font: 400 clamp(22px, 2.6vw, 28px)/1.1 var(--display); color: var(--violet); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.type { font: 800 12px/1 var(--body); letter-spacing: .04em; background: var(--ink); color: var(--paper); padding: 6px 10px; border-radius: 999px; }
.facts { margin: 0; padding-left: 1.1em; display: grid; gap: 5px; font-weight: 600; }
.facts li::marker { color: var(--sun-deep); }
.note { margin: 0; color: var(--ink-soft); font-weight: 600; font-size: 14px; }
.btn { font: 800 16px/1 var(--body); border: 0; border-radius: 12px; cursor: pointer; padding: 11px 16px; color: var(--ink); background: var(--sun); box-shadow: 0 4px 0 var(--sun-deep); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sun-deep); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 2px var(--paper-edge); color: var(--ink-soft); }
.feedback { min-height: 1.3em; font-weight: 700; margin: 0; }
.feedback:empty { display: none; }
.feedback.oops { color: var(--oops-ink); }
.feedback.good { color: var(--good-ink); }
.badge { position: absolute; right: 16px; top: -14px; font: 400 12px/1 var(--display); background: var(--good); color: var(--ink); padding: 7px 11px; border-radius: 999px; transform: rotate(4deg); z-index: 2; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; }
.stat { background: rgba(34, 28, 64, .06); border-radius: 10px; padding: 7px 10px; min-width: 0; }
.stat span { display: block; font: 400 10px/1.2 var(--display); letter-spacing: .05em; color: var(--ink-soft); }
.stat b { font-size: 15px; line-height: 1.25; }
.compare span { display: block; font: 400 10px/1.2 var(--display); letter-spacing: .05em; color: var(--ink-soft); }
.compare svg { width: 100%; max-width: 240px; height: auto; display: block; }
.levels { display: grid; gap: 8px; }
.level { text-align: left; cursor: pointer; border: 2px solid var(--paper-edge); background: var(--paper-2); border-radius: 14px; padding: 10px 12px; color: var(--ink); font: 600 14px/1.35 var(--body); display: grid; gap: 3px; min-width: 0; }
.level:hover { border-color: var(--violet); }
.level strong { font: 400 15px/1.1 var(--display); color: var(--violet); }
.level em { font-style: normal; font-weight: 800; color: var(--ink-soft); font-size: 12px; }
.level .best { font-size: 12px; color: var(--good-ink); font-weight: 700; }
.cert { border: 3px double var(--sun-deep); border-radius: 14px; padding: 14px; background: repeating-linear-gradient(45deg, rgba(255,194,61,.08) 0 10px, transparent 10px 20px), var(--paper-2); display: grid; gap: 6px; text-align: center; justify-items: center; }
.cert .top { font: 400 11px/1 var(--display); letter-spacing: .14em; color: var(--sun-deep); }
.cert .who { font: 400 clamp(22px, 3vw, 28px)/1.1 var(--display); color: var(--violet); margin: 0; overflow-wrap: anywhere; }
.cert p { margin: 0; }
.cert .stars { font-size: 20px; letter-spacing: 2px; color: var(--sun-deep); overflow-wrap: anywhere; }
.cert .meta { font-size: 13px; color: var(--ink-soft); font-weight: 700; }
fieldset { border: 2px solid rgba(107, 93, 51, .25); border-radius: 12px; margin: 0; padding: 8px 12px 10px; min-width: 0; }
legend { font: 400 11px/1 var(--display); letter-spacing: .06em; color: var(--ink-soft); padding: 0 4px; }
.checks { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.checks label { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 15px; cursor: pointer; }
.checks input { width: 18px; height: 18px; accent-color: var(--violet); }
.minibtns { display: flex; gap: 6px; margin-top: 4px; }
.mini { font: 700 12px/1 var(--body); border: 0; background: none; color: var(--violet); text-decoration: underline; cursor: pointer; padding: 2px; }

/* Map */
.stage { position: relative; min-height: 0; min-width: 0; border-radius: 22px; overflow: hidden; border: 2px solid #232b63; background: radial-gradient(circle at 50% 50%, rgba(255,194,61,.12), transparent 35%), rgba(14, 19, 52, .75); }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; touch-action: none; cursor: pointer; user-select: none; -webkit-user-select: none; }
#sky:focus { outline: none; }
#sky.dragging { cursor: grabbing; }
.mapbar { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; flex-wrap: wrap-reverse; justify-content: space-between; align-items: end; gap: 6px; z-index: 3; pointer-events: none; }
.mapbar > * { pointer-events: auto; }
.zooms { display: flex; gap: 6px; margin-left: auto; }
.zb { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: rgba(21, 28, 70, .92); color: var(--paper); font: 800 22px/1 var(--body); cursor: pointer; display: grid; place-items: center; padding: 0; }
.zb.wide { width: auto; padding: 0 12px; font-size: 13px; }
.zb:hover { border-color: var(--sun); }
.modes { display: flex; flex-wrap: wrap; gap: 6px; }
.modes .chip { background: rgba(21, 28, 70, .92); font-size: 13px; padding: 9px 11px; }
.scenes { position: absolute; top: 8px; left: 8px; display: flex; gap: 6px; z-index: 3; }
.scenes .chip { background: rgba(21, 28, 70, .92); font-size: 13px; padding: 9px 12px; }
.stage.galaxy { background: radial-gradient(circle at 50% 50%, rgba(255, 214, 150, .08), transparent 45%), #070a20; }
.stage.galaxy #realBtn, .stage.galaxy #moveBtn { display: none; }
#sky .bubble { fill: rgba(255, 210, 120, .07); stroke: rgba(255, 210, 120, .7); stroke-width: 1.5; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; pointer-events: none; }
#sky .armlabel { fill: #c8d4ff; font-style: italic; font-weight: 600; opacity: .8; }
#sky .mwlabel { font-family: var(--display); fill: #e8ecff; }
#sky .nearobj, #sky .nearlabel { display: none; }
#sky.near .nearobj, #sky.near .nearlabel { display: inline; }
#sky.near .nbhdlabel { display: none; }
#sky .nbhdlabel { fill: #ffd98a; }
#sky .galaxydisk .ring { stroke-width: 3; }
.skychart { display: grid; gap: 4px; }
.skychart svg { width: 100%; max-width: 320px; height: auto; display: block; border-radius: 12px; }
.mapnote { position: absolute; left: 12px; right: 12px; top: 52px; font: 700 12px/1.3 var(--body); color: var(--dim); pointer-events: none; margin: 0; }
.toast { position: absolute; left: 10px; right: 10px; bottom: 60px; z-index: 4; background: var(--paper); color: var(--ink); border-radius: 12px; padding: 9px 36px 9px 12px; font-weight: 700; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.4); cursor: pointer; }
.toast::after { content: "×"; position: absolute; right: 12px; top: 6px; font-size: 20px; color: var(--ink-soft); }
.toast b { color: var(--violet); }

#sky .orbit { fill: none; stroke: var(--orbit); stroke-width: 1; vector-effect: non-scaling-stroke; }
#sky .orbit.far { stroke-opacity: .55; }
#sky .orbit.comet { stroke: #7f9cc9; stroke-opacity: .5; stroke-dasharray: 4 5; }
#sky .label { fill: var(--paper); font-family: var(--body); font-weight: 700; font-size: calc(var(--fs, 13) * 1px); paint-order: stroke; stroke: var(--space); stroke-width: calc(var(--fs, 13) * .3px); stroke-linejoin: round; text-anchor: middle; pointer-events: none; }
#sky .label.beltlabel { fill: var(--dim); font-style: italic; }
#sky .label.small { fill: #d9dcf5; }
#sky.hide-names .label { display: none; }
#sky .moonlabel { display: none; }
#sky.close:not(.real) .moonlabel { display: inline; }
#sky .num { fill: var(--sun); font-family: var(--display); font-size: calc(var(--fs, 13) * 1.15px); paint-order: stroke; stroke: var(--space); stroke-width: calc(var(--fs, 13) * .35px); text-anchor: middle; pointer-events: none; }
#sky .obj { outline: none; }
#sky .ring { fill: none; stroke: transparent; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
#sky .obj.found .ring { stroke: var(--good); }
#sky .obj.hover .ring, #sky .obj:focus-visible .ring { stroke: var(--sun); }
#sky .obj:focus-visible .ring { stroke-width: 3.5; }
#sky .obj.nope .ring { stroke: var(--oops); }
#sky .band { fill: none; stroke: rgba(210, 196, 170, .09); }
#sky .belt.kuiper .band { stroke: rgba(170, 210, 255, .07); }
#sky .belt.found .band { stroke: rgba(82, 219, 166, .16); }
#sky .belt.hover .band, #sky .belt:focus-visible .band { stroke: rgba(255, 194, 61, .22); }
#sky .belt.nope .band { stroke: rgba(255, 127, 110, .25); }
#sky .moonbody { opacity: 0; transition: opacity .5s; pointer-events: none; }
#sky.close:not(.real) .moonbody { opacity: 1; }

/* Dialogs */
dialog { border: 0; padding: 0; border-radius: 18px; background: var(--paper); color: var(--ink); width: min(620px, calc(100% - 32px)); max-height: min(86%, 760px); box-shadow: 0 20px 60px rgba(0,0,0,.6); }
dialog::backdrop { background: rgba(5, 8, 30, .7); }
.dlg { display: flex; flex-direction: column; max-height: inherit; }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 2px dashed rgba(107, 93, 51, .2); }
.dlg-head h2 { margin: 0; font: 400 18px/1.1 var(--display); color: var(--violet); }
.dlg-body { overflow-y: auto; padding: 14px 18px 18px; display: grid; gap: 10px; }
.dlg h3 { margin: 4px 0 0; font: 400 11px/1 var(--display); letter-spacing: .08em; color: var(--ink-soft); }
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; }
.stamp { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 2px dashed var(--paper-edge); display: grid; place-items: center; font: 800 11px/1.05 var(--body); color: #a99c74; text-align: center; padding: 4px; overflow-wrap: anywhere; }
.stamp img { width: 58%; height: auto; }
.stamp { align-content: center; gap: 2px; }
.stamp.got { border: 3px solid var(--good-ink); color: var(--good-ink); background: rgba(82, 219, 166, .15); transform: rotate(-8deg); }
.players { display: grid; gap: 6px; }
.player { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; border: 2px solid var(--paper-edge); background: var(--paper-2); border-radius: 12px; padding: 10px 12px; font: 700 16px/1.2 var(--body); color: var(--ink); cursor: pointer; }
.player[aria-current="true"] { border-color: var(--violet); color: var(--violet); }
.player small { font-weight: 600; color: var(--ink-soft); font-size: 13px; }
.addrow { display: flex; flex-wrap: wrap; gap: 8px; }
.addrow input { flex: 1 1 160px; min-width: 0; font: 700 16px/1 var(--body); padding: 10px 12px; border-radius: 10px; border: 2px solid var(--paper-edge); background: #fff; color: var(--ink); }

/* ----- game layer ----- */
.app.behind { opacity: 0; pointer-events: none; }
.hud { display: flex; align-items: center; gap: 10px; }
.hud .track { position: relative; flex: 1; margin-right: 12px; height: 10px; border-radius: 99px; background: rgba(34, 28, 64, .12); }
.hud .fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--violet), var(--sun)); transition: width .6s; }
.hud .ship { position: absolute; top: 50%; transform: translate(-50%, -55%) rotate(45deg); font-size: 18px; transition: left .6s; }
.hud .combo { font-weight: 800; font-size: 14px; color: var(--ink-soft); opacity: .45; white-space: nowrap; }
.hud .combo.on { opacity: 1; color: #d6461f; animation: pulse 1s ease-in-out infinite; }
.hud .xp, .hud .score { font: 400 12px/1 var(--display); color: var(--violet); white-space: nowrap; }
.hud .timer { font: 400 22px/1 var(--display); color: var(--violet); min-width: 56px; }
.hud .timer.low { color: var(--oops-ink); animation: pulse .5s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.floater { position: absolute; right: 18px; top: 46px; z-index: 5; pointer-events: none; font: 400 16px/1 var(--display); color: var(--violet); background: var(--paper); padding: 6px 10px; border-radius: 99px; box-shadow: 0 6px 16px rgba(0,0,0,.25); animation: floatup 1.7s ease-out forwards; }
@keyframes floatup { 0% { opacity: 0; transform: translateY(10px) scale(.8); } 15% { opacity: 1; transform: translateY(0) scale(1.05); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-40px); } }
#sky .obj.yes .ring { stroke: var(--good); stroke-width: 5; }
.results { display: grid; gap: 12px; justify-items: center; text-align: center; }
.bigstars { display: flex; gap: 6px; font-size: 56px; line-height: 1; }
.bigstars span { color: rgba(34, 28, 64, .15); }
.bigstars span.on { color: var(--sun); text-shadow: 0 3px 0 var(--sun-deep); animation: starpop .5s var(--d) both cubic-bezier(.3, 1.6, .5, 1); }
@keyframes starpop { 0% { transform: scale(0) rotate(-30deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
.bignum { margin: 0; font: 400 72px/1 var(--display); color: var(--violet); }
.result-stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.result-stats div { background: rgba(34, 28, 64, .06); border-radius: 12px; padding: 8px 14px; display: grid; min-width: 86px; }
.result-stats b { font: 400 20px/1.1 var(--display); color: var(--violet); }
.result-stats span { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.rankbar { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; width: 100%; max-width: 420px; }
.rankbar .rk { font: 400 14px/1 var(--display); color: var(--sun-deep); }
.rankbar .track { height: 10px; border-radius: 99px; background: rgba(34, 28, 64, .12); overflow: hidden; }
.rankbar .fill { height: 100%; background: linear-gradient(90deg, var(--sun), #ff8a3d); border-radius: 99px; }
.rankbar .nx { grid-column: 1 / -1; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.certbox summary { cursor: pointer; font-weight: 800; color: var(--violet); }
.certbox[open] summary { margin-bottom: 8px; }
.checkrow { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 14px; color: var(--ink-soft); }
.checkrow input { width: 18px; height: 18px; accent-color: var(--violet); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.badgeitem { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; align-items: center; border: 2px dashed var(--paper-edge); border-radius: 12px; padding: 8px 10px; opacity: .6; }
.badgeitem.got { border: 2px solid var(--good-ink); background: rgba(82, 219, 166, .12); opacity: 1; }
.badgeitem .bicon { grid-row: span 2; font-size: 28px; filter: grayscale(1); }
.badgeitem.got .bicon { filter: none; }
.badgeitem strong { font-size: 14px; }
.badgeitem span:last-child { font-size: 12px; color: var(--ink-soft); font-weight: 600; }

(function stars() {
  const cv = document.querySelector("#stars"), x = cv.getContext("2d"); let pts = [];

    pts = Array.from({ length: Math.round(innerWidth * innerHeight / 3500) }, () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, r: (Math.random() * 1.3 + .3) * devicePixelRatio, p: Math.random() * 6.28, sp: Math.random() * .02 + .005 }));

  const bits = Array.from({ length: count }, () => ({ x: cv.width / 2 + (Math.random() - .5) * cv.width * .3, y: cv.height * .35, vx: (Math.random() - .5) * 14 * dpr, vy: (-Math.random() * 12 - 4) * dpr, r: (Math.random() * 5 + 4) * dpr, a: Math.random() * 6.28, va: (Math.random() - .5) * .3, col: pick(colors) }));

      b.vy += .35 * dpr; b.x += b.vx; b.y += b.vy; b.a += b.va;
      x.save(); x.translate(b.x, b.y); x.rotate(b.a); x.fillStyle = b.col; x.beginPath();

  let queue;
  try {
    const finds = take([...PLANET_IDS, ...DWARF_IDS, ...BELT_IDS, ...MOON_IDS, "halley", "bennu", ...GALAXY_FIND], 3).map(id => qFind(id, ["easy", "hard", "map"]));
    queue = shuffle([...finds, qCompare([...PLANET_IDS, ...DWARF_IDS, "moon"]), qCount(pick(["solar", "galaxy"]))]);
  } finally { Math.random = orig; }
  Object.assign(S, fresh(), { level: "d", cfg: { name: "Daily Challenge", tiers: ["easy", "hard", "map"], hintAfter: 2, autoRead: false, names: false, reading: "kid" },
    mode: "daily", names: false, queue });
  hideHome(); enterItem(); render(); showAll();
}

/* ================= home screen ================= */
const home = document.querySelector("#home"), homeBody = document.querySelector("#homeBody"), appEl = document.querySelector(".app");
let homeView = "title";
const inMission = () => ["brief", "clue", "found", "lesson", "lineup"].includes(S.phase) || (S.phase === "done" && S.queue.length);
function showHome(view) {
  homeView = view || (inMission() ? "title" : homeView || "title");
  home.hidden = false; appEl.classList.add("behind"); stopSpeech(); renderHome();
  homeBody.querySelector("[data-hplay], [data-hback]")?.focus({ preventScroll: true });
}
function hideHome() {
  home.hidden = true; appEl.classList.remove("behind");
  requestAnimationFrame(() => { fitFull(); redraw(); });
}
const starIcons = n => [1, 2, 3].map(i => `<span class="${i <= n ? "on" : ""}">★</span>`).join("");
const tile = (data, img, title, sub, extra = "") => `<button class="tile ${extra}" type="button" data-${data}>${img.startsWith("<") ? img : `<img src="${spriteSrc(img)}" alt="">`}<strong>${title}</strong><span>${sub}</span></button>`;
function renderHome() {
  homeBody.className = `home-inner view-${homeView}`;
  const r = rankOf(P.xp), cur = RANKS[r][0], nxt = RANKS[r + 1]?.[0], pct = nxt ? Math.round((P.xp - cur) / (nxt - cur) * 100) : 100;
  const totalStars = Object.values(P.done).reduce((a, n) => a + n, 0);
  const counters = `<div class="counters">
      <span class="ctr" title="Mission stars"><i aria-hidden="true">⭐</i><b>${totalStars}</b><span class="sr">mission stars</span></span>
      <span class="ctr" title="Badges"><i aria-hidden="true">🏅</i><b>${P.badges.length}</b><span class="sr">badges</span></span>
      <span class="ctr wide" title="Passport stamps"><i aria-hidden="true">🪐</i><b>${P.book.length}/${ALL.length}</b><span class="sr">stamps</span></span>
      <button class="roundbtn" type="button" data-hsound aria-label="${store.sound ? "Turn sound off" : "Turn sound on"}">${store.sound ? "🔊" : "🔇"}</button></div>`;
  const top = `<div class="home-top">
      ${homeView === "missions" ? `<button class="roundbtn back" type="button" data-hback aria-label="Back">←</button>` : ""}
      <button class="profile" type="button" data-hplayer aria-label="Player ${esc(store.current)}, level ${r + 1} ${RANKS[r][1]}. Change player">
        <span class="lvl"><small>LV</small>${r + 1}</span>
        <span class="pinfo"><b>${esc(store.current)}</b><span class="prank">${RANKS[r][1]}</span>
          <span class="pbar"><span style="width:${pct}%"></span></span><span class="pxp">${P.xp.toLocaleString()}${nxt ? ` / ${nxt.toLocaleString()}` : ""} XP</span></span>
      </button>${counters}</div>`;
  const dailyDone = P.daily?.date === todayKey();
  const dailyTile = tile("hdaily", '<span class="ticon">📅</span>', "Daily Challenge", dailyDone ? `Done today ${starIcons(P.daily.stars)} · streak ${P.dailyStreak}` : `5 quick questions · streak ${P.dailyStreak || 0}`, dailyDone ? "done" : "glow");
  const speedTile = tile("hspeed", '<span class="ticon">⚡</span>', "Speed Run", `90 seconds · best ${P.bestSpeed}`);
  if (homeView === "missions") {
    homeBody.innerHTML = top + `<h2 class="home-h2">Choose your mission</h2>
      <div class="path">${MISSIONS.map((m, i) => {
        const L = LEVELS[m.lv], open = unlocked(m.lv), st = P.done[m.lv] || 0;
        return `<button class="node ${open ? "" : "locked"} ${st ? "cleared" : ""}" type="button" data-hlevel="${m.lv}" aria-disabled="${!open}">
          <span class="node-num">${i + 1}</span><img src="${spriteSrc(m.icon)}" alt=""><strong>${L.name}</strong><em>${L.ages}</em>
          <span class="nstars" aria-label="${st} of 3 stars">${starIcons(st)}</span>
          <span class="nblurb">${open ? L.blurb : `🔒 Finish ${LEVELS[missionOf(m.lv).needs].name} to unlock`}</span></button>`;
      }).join("")}</div>
      <div class="tiles">${dailyTile}${speedTile}${tile("hcustom", '<span class="ticon">🛠️</span>', "Make your own mission", "For grown-ups and teachers")}</div>`;
    return;
  }
  const cont = inMission() && S.phase !== "done" ? `<button class="btn continue" type="button" data-hcontinue>▶ Continue ${level()?.name || "mission"}${S.mode === "speed" ? "" : ` · ${qNumber()}/${qList().length}`}</button>` : "";
  const ring = (id, inset, secs, start, size) => `<div class="oring" style="inset:${inset}%;--t:${secs}s;--d:${-secs * start}s;--s:${size}%"><img src="${spriteSrc(id)}" alt=""></div>`;
  const dock = (data, icon, label, pip = "", cls = "") => `<button class="dbtn ${cls}" type="button" data-${data}><span class="disc">${icon.startsWith("<") ? icon : `<img src="${spriteSrc(icon)}" alt="">`}${pip ? `<span class="pip">${pip}</span>` : ""}</span><span class="dlbl">${label}</span></button>`;
  homeBody.innerHTML = top + `<div class="hstage">
      <div class="orrery" aria-hidden="true"><img class="osun" src="${spriteSrc("sun")}" alt="">${ring("earth", 30, 9, .1, 24)}${ring("mars", 20, 15, .55, 17)}${ring("jupiter", 9, 26, .8, 21)}${ring("saturn", -2, 40, .32, 27)}<div class="oring rocketring" style="inset:14%;--t:7s;--d:-2s"><span class="rocket">🚀</span></div></div>
      <span class="shoot s1" aria-hidden="true"></span><span class="shoot s2" aria-hidden="true"></span>
      <div class="menu">
        <h1 class="logo"><span class="l1">Solar System</span><span class="l2">Scavenger Hunt</span></h1>
        <button class="btn play" type="button" data-hplay><span class="tri" aria-hidden="true">▶</span>Play</button>
        ${cont}
      </div>
    </div>
    <nav class="dock" aria-label="More ways to play">
      ${dock("hdaily", '<span class="ticon">📅</span>', "Daily", dailyDone ? "✓" : "!", dailyDone ? "done" : "hot")}
      ${dock("hspeed", '<span class="ticon">⚡</span>', "Speed Run", P.bestSpeed ? String(P.bestSpeed) : "")}
      ${dock("hexplore", "saturn", "Explore")}
      ${dock("hschool", '<span class="ticon">🎓</span>', "School", `${P.lessons.length}/${Object.keys(LESSONS).length}`)}
      ${dock("hsky", "moon", "Sky Tonight")}
      ${dock("hpass", '<span class="ticon">🏅</span>', "Passport", P.badges.length ? String(P.badges.length) : "")}
    </nav>`;
}
homeBody.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if ("hplay" in d) { homeView = "missions"; renderHome(); homeBody.querySelector("[data-hback]")?.focus(); }
  else if ("hback" in d) { homeView = "title"; renderHome(); }
  else if ("hcontinue" in d) { hideHome(); render(); if (S.mode === "speed") { if (secsLeft() <= 0) endSpeed(); else runSpeedTimer(); } }
  else if (d.hlevel) {
    const lv = +d.hlevel;
    if (!unlocked(lv)) { t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake"); beep(false); return; }
    hideHome(); startMission(lv);
  }
  else if ("hdaily" in d) startDaily();
  else if ("hspeed" in d) startSpeed();
  else if ("hcustom" in d) { hideHome(); Object.assign(S, fresh(), { phase: "custom" }); render(); }
  else if ("hexplore" in d) { hideHome(); Object.assign(S, fresh(), { phase: "explore", names: true }); render(); showAll(); }
  else if ("hschool" in d) { hideHome(); Object.assign(S, fresh(), { phase: "school", lesson: "" }); render(); }
  else if ("hsky" in d) { hideHome(); Object.assign(S, fresh(), { phase: "sky" }); award("sky"); render(); }
  else if ("hpass" in d) { renderPassport(); passDlg.showModal(); }
  else if ("hplayer" in d) openPlayers(false);
  else if ("hsound" in d) { store.sound = !store.sound; if (!store.sound) stopSpeech(); save(); renderHome(); }
});

/* ================= boot (keeps progress across page updates and visits) ================= */
function start(data) {
  if (data && data.store) { store = data.store; bindPlayer(); } else load();
  fitFull(); view = { ...FULL }; noteText(); render(); showHome("title");
  const q = S.queue[S.idx], focus = S.phase === "found" ? (q?.t === "choice" ? q.about : S.answer) : S.look;
  if (focus && byId[focus]) { setScene(byId[focus].scene || "solar"); follow = byId[focus].scene === "galaxy" ? "" : focus; zoomTo(viewFor(focus), 0); }
}
try { window.claude?.hot?.snapshot?.(() => ({ store })); } catch (_) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body></html>
